[pytest]
# The roadmap gate's own tests (scripts/feature_gate/test/). Kept apart from voc-datalake/pytest.ini, whose addopts
# measure lambda/ coverage. Run from the repo root:
#   bash scripts/pinned.sh python -m pytest -q -c scripts/feature_gate/pytest.ini scripts/feature_gate/test
# `pythonpath = .. test` puts scripts/ (the `feature_gate` package) and test/ (planted.py) on sys.path.
testpaths = test
python_files = test_*.py
pythonpath = .. test
addopts = -q -p no:cacheprovider --import-mode=importlib
