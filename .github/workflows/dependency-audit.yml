# Known-vulnerability audit of every npm lockfile and every Python requirements file:
# scripts/dependency-audit.mjs, the same command a contributor runs locally (docs/dependencies.md).
#
# When it runs:
# - pull requests that change a lockfile, a manifest, a requirements file, the reviewed-ignore file or
#   the audit itself (paths below), so a new advisory is caught where it is introduced;
# - weekly on a schedule, because advisories are published against code nobody is changing. A red
#   scheduled run opens an issue through scheduled-failure-watch.yml;
# - by hand (workflow_dispatch).
#
# What fails (the script's header has the detail): npm production advisories of high or critical
# severity, npm development advisories of critical severity, any known advisory in a Lambda layer's
# Python requirements, an expired or malformed reviewed ignore, and an audit that could not run.
name: dependency audit

on:
  pull_request:
    paths:
      - '**/package-lock.json'
      - '**/package.json'
      - 'voc-datalake/requirements-dev.txt'
      - 'voc-datalake/lambda/layers/*/requirements.txt'
      - '.github/dependency-audit-ignore.json'
      - 'scripts/dependency-audit.mjs'
      - 'scripts/dependency-audit.test.mjs'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    # Mondays 05:23 UTC, before Dependabot's 06:00 run, so the week's version-update pull requests
    # arrive after any new advisory has been reported.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  # A newer push supersedes a pull-request run; a scheduled or manual run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: npm audit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm audit reads the lockfiles and asks the registry; no `npm ci` is needed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # 3.12 is the interpreter the gates use. The Lambda layers are resolved for their own target
      # (CPython 3.14, manylinux2014_aarch64) by the script's pip flags, whatever runs pip.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # pip-audit is pinned exactly and kept out of the interpreter that resolves the requirements.
      - name: Install pip-audit
        env:
          PIP_AUDIT_VERSION: 2.10.1
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --disable-pip-version-check -q "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Test the audit script
        run: node --test scripts/dependency-audit.test.mjs

      - name: Audit
        run: |
          PIP_AUDIT="$RUNNER_TEMP/pip-audit/bin/pip-audit" AUDIT_PYTHON="$(command -v python)" \
            node scripts/dependency-audit.mjs
