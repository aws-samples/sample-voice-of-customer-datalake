# Runs the MCP-specific Python test surface on every pull request.
#
# WHAT IT COVERS IS NOT DEFINED HERE. `voc-datalake/scripts/mcp_gate.py` owns
# the path globs, the explicitly-named modules and the per-module floors, and
# this workflow asks it for them. That indirection exists because the scope was
# previously spelled out twice in this file — once in a collected-count step and
# once in the run step — so widening the gate meant editing both, and editing
# one left the floor measuring a different surface than the one being run. The
# script's module docstring carries the inventory and the reason each module is
# in it.
#
# Scoped on purpose: this is the MCP backend gate, not the backend suite. It
# exists because the MCP server's regressions are the invisible kind — a tool
# declaration that drifts from the payload it describes, a scope table that
# stops matching its handler table, a delegated route whose error no longer
# maps — and each of those passes a frontend build and a CDK synth. Making
# them visible is the prerequisite for the first write-tool vertical slice,
# where the cost of a silent catalog or authorization defect stops being a
# read of the wrong shape.
#
# `no-event-logging-guard.yml` stays separate rather than gaining a second
# job. That guard imports nothing but `re` and `pathlib` and runs with
# `--noconftest`, so it answers in under a second and cannot be reddened by a
# dependency problem. This workflow installs the application's dependencies
# and loads both conftest layers, so it can. Two workflows keep the fast
# source-only signal readable when the heavier one is broken.
#
# The root `test:backend` script is not reused here: it invokes
# `.venv/bin/python`, which no fresh Actions runner has. Fixing that script's
# portability is its own change; this job calls setup-python's interpreter
# directly.
name: MCP backend tests

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

# A superseded push on the same PR branch has nothing left to prove: its tree
# is already gone. Cancelling keeps the checks list on an actively-pushed PR
# from filling with stale in-progress entries, which is what branch protection
# reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-tests:
    # Short and stable on purpose. This string is the identifier branch
    # protection keys on, so it is the one thing here that cannot be renamed
    # cheaply — a rename silently stops enforcing the required check. The
    # enumeration of what the job covers lives in the header comment, where
    # there is room for it and where changing it costs nothing.
    name: MCP backend tests
    runs-on: ubuntu-latest
    # The suite is host-side and finishes in seconds; the ceiling is here to
    # cap a hung install or a test that starts waiting on a network call
    # rather than to accommodate the run time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in this job pushes, tags, or calls the API, and the next
          # step pip-installs from the checked-out tree — which on a fork PR
          # is untrusted content. Keep the token out of `.git/config` rather
          # than leaving it readable there for the length of the job.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          # Both installed files key the cache. Keying on only one would serve
          # a stale wheel set whenever the other moved.
          cache-dependency-path: |
            voc-datalake/requirements-dev.txt
            voc-datalake/lambda/layers/processing-deps/requirements.txt

      # Two files, both needed:
      #
      # requirements-dev.txt supplies pytest and `jsonschema`, which
      # test_mcp_output_schema_conformance.py uses to validate every declared
      # `outputSchema` against a payload the tool really produces.
      #
      # processing-deps/requirements.txt supplies the tracer extra
      # (`aws-lambda-powertools[tracer]`, hence aws_xray_sdk) and pydantic.
      # The MCP handler and the domain API modules it delegates to decorate
      # helpers with `@tracer.capture_method` at import time, so without this
      # file collection fails on ModuleNotFoundError before a single
      # assertion runs. requirements-dev.txt's own header names it as the
      # companion install for exactly this reason.
      #
      # The modules under `lambda/shared/test/` need nothing beyond these two:
      # the token, vocabulary-mirror, runtime-lockstep and gate-audit modules are
      # pure Python over `shared/mcp_tokens.py`, over source files read as text,
      # and over `scripts/mcp_gate.py` respectively.
      #
      # No Lambda layer *build* is needed — these are host-side unit tests
      # importing the modules directly, not a packaged bundle. Node, AWS
      # credentials and a container runtime are likewise absent because
      # nothing here synthesizes CDK, builds the frontend, or reaches an AWS
      # endpoint: the conftest layers mock AWS at the import boundary.
      #
      # Known exposure: both files bound their dependencies with `>=` and only
      # `jsonschema` is capped (`<5`), and `.python-version` pins a floating
      # patch of 3.14. So a breaking upstream release can turn this gate red
      # on a pull request that changed nothing. A red run whose failure is an
      # import error, a resolver conflict, or a message naming a third-party
      # package is a dependency-resolution problem, not an MCP regression —
      # triage it as such before suspecting the diff under test. Closing the
      # hole properly means pinning (a `constraints.txt` fed to `pip install
      # -c`, or a lockfile) across both files, which is a repository-wide
      # policy change rather than something this gate should decide alone.
      #
      # `pytest>=8.0.0` is uncapped and a clean install currently resolves 9.x,
      # so pytest's own major is part of that exposure. The gate deliberately
      # does not parse pytest's console summary — `scripts/mcp_gate.py` reads the
      # JUnit XML instead, precisely because that structure is an interchange
      # format while the `-q` summary line is presentation output free to change
      # in any release. A failure reading the report is therefore also a
      # dependency symptom, not a finding about the diff.
      - name: Install test and application dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r voc-datalake/requirements-dev.txt
          -r voc-datalake/lambda/layers/processing-deps/requirements.txt

      # -o addopts="": pytest.ini's addopts turn every run into a
      # whole-repository coverage run (`--cov=lambda --cov=plugins`) that also
      # writes an HTML report. Neither is wanted from a focused gate, and the
      # ignore flags in there are aimed at a full-tree collection this run
      # does not perform. Clearing addopts drops only those defaults —
      # testpaths, python_files, filterwarnings and conftest discovery are
      # separate keys and stay in force.
      #
      # Unlike the event-logging guard, conftest loading is kept: these
      # modules take fixtures from lambda/conftest.py and
      # lambda/api/test/conftest.py, which also perform the AWS-mocking import
      # setup the MCP and API modules are collected under.
      #
      # The paths are resolved in their OWN statement before pytest runs. Inlining
      # the substitution into the pytest command would let a failure of the script
      # itself pass unnoticed: the substitution would expand to nothing, pytest
      # would fall back to `pytest.ini`'s `testpaths` and run the whole tree, and
      # the gate would audit a surface it did not define. As a separate
      # assignment, errexit reddens the step instead.
      #
      # `$paths` is then deliberately UNQUOTED: the script emits globs unexpanded
      # so the shell splits and expands them here. A glob that matches nothing
      # therefore reaches pytest, which exits 4 on an unknown path rather than
      # quietly running a shorter list.
      #
      # Serial by design: no -n/xdist. The suite is seconds long, and these
      # modules mutate module-level registries and environment during import,
      # so distributing them would trade a real signal for noise.
      #
      # `continue-on-error` is deliberately absent, but the audit below must run
      # even when tests fail — otherwise a failing run would mask a shrinking
      # one — so this step records its own outcome and the job fails at the end.
      - name: Run MCP test surface
        id: run-tests
        working-directory: voc-datalake
        env:
          # botocore otherwise probes the EC2 instance metadata endpoint when
          # a mocked client is built without a region, spending the connect
          # timeout on every such client. Nothing in this job has, or should
          # have, an AWS session.
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -uo pipefail
          # Errexit is in force (GitHub runs this with `bash -e`, and `set` only
          # turns options ON), so a failure of the gate script itself aborts here
          # rather than silently yielding an empty path list.
          paths=$(python scripts/mcp_gate.py --print-paths)
          # An empty result would make pytest fall back to pytest.ini's
          # `testpaths` and run the whole tree — green, but not this gate.
          test -n "${paths}"
          # `|| status=$?` rather than reading `$?` on the next line: a bare
          # failing pytest would abort the step under errexit before the outcome
          # could be recorded. A command on the left of `||` is exempt, which is
          # what makes the capture reachable.
          status=0
          # SC2086 is the intended behaviour here, not an oversight: the script
          # prints its globs UNEXPANDED so this word-splits and glob-expands
          # them. Quoting would hand pytest one argument containing literal
          # `*`s and spaces, which it would reject as a single missing path.
          # shellcheck disable=SC2086
          python -m pytest ${paths} \
            -o addopts="" -p no:cacheprovider \
            --junit-xml=mcp-gate-report.xml \
            --no-header --tb=short -q || status=$?
          echo "exit-code=${status}" >>"${GITHUB_OUTPUT}"

      # Asserts on the tests that RAN, per module, against the floors in
      # `scripts/mcp_gate.py`.
      #
      # Exit code alone is not enough, and neither was the collected-count floor
      # this replaces: `--co` counts collected tests, and a skipped test is
      # collected, so one line — `pytestmark = pytest.mark.skip(...)` at module
      # scope — left the count at its floor while the module asserted nothing.
      # `skipif` on a condition false on the runner does the same, and
      # `xfail(strict=False)` is worse: a test that starts failing gets marked
      # and reports success indefinitely. The audit reads the JUnit report, where
      # all three appear as `<skipped>` and none of them count.
      #
      # `!cancelled()` so a red test run is still audited: a shrunken gate and a
      # failing test are different diagnoses and the log should carry both. Also
      # gated on the test step having actually run — if the install failed, the
      # tests were skipped, and auditing then would report "no JUnit report,
      # treat this as a failure of the run", dressing a dependency problem up as
      # a shrunken gate.
      - name: Check the MCP gate has not shrunk
        if: ${{ !cancelled() && steps.run-tests.outcome != 'skipped' }}
        working-directory: voc-datalake
        run: python scripts/mcp_gate.py --audit mcp-gate-report.xml

      # The tests' own verdict, applied after the audit so both are visible.
      # Skipped along with the audit when the tests never ran, so an empty
      # exit-code is never compared against '0'.
      - name: Report the test result
        if: ${{ !cancelled() && steps.run-tests.outcome != 'skipped' && steps.run-tests.outputs.exit-code != '0' }}
        run: |
          echo "::error::The MCP test surface failed (pytest exit ${{ steps.run-tests.outputs.exit-code }}). See the 'Run MCP test surface' step."
          exit 1

      # Kept on failure only: a green run's report says nothing the log does not,
      # while a red one is worth having as XML when the console output is
      # truncated or the failure is a collection error.
      - name: Upload the JUnit report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-gate-report
          path: voc-datalake/mcp-gate-report.xml
          if-no-files-found: warn
