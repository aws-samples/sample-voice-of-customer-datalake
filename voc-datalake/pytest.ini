[pytest]
testpaths = lambda plugins
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# --strict-markers: a misspelt marker (`@pytest.mark.slwo`) is a collection error, not a silent no-op. Every
# custom marker is registered: the two below, `real_watermark` by lambda/aggregator/test/conftest.py, and
# `xdist_group` by pytest-xdist. (A flag rather than pytest 9's `strict_markers` key, because
# requirements-dev.txt still admits pytest 8, which does not know that key.)
addopts = -v --tb=short --strict-markers --ignore=cdk.out --ignore=dist --ignore=frontend --ignore=lambda/layers --cov=lambda --cov=plugins --cov-report=term-missing --cov-report=html:coverage_html --cov-fail-under=0
# An xfail test that passes fails the run, so a fixed bug cannot hide behind a stale xfail.
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:No application metrics to publish.*:UserWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    timing: the test bounds its own running time; run untraced and apart from the parallel suite (docs/coverage-gate.md)
norecursedirs = cdk.out .venv node_modules dist frontend .git layers _template
