schema: voc-automation/1
id: bug-fixer
version: 2
seed_marker: {pk: AGENTSEED#bug-fixer, sk: META}       # 7.47.00's marker, unchanged
name: Bug fixer
description: 'Fixes the bugs customers report: a labelled GitHub issue, or a run of bug reports, becomes a pull request that says "Fixes #N"'
flow: bug-hunt-and-fix
enabled: false
scope: {all: true}
instructions: ''
# The issue trigger acts on an issue once its trusted triage says bug (while an Issue triage agent watches the
# connection; else on the issue's feedback type, 7.47.00's rule): the heartbeat reads requires_triage on the trigger.
triggers:
  - {kind: github_issue, label: voc-agent, trusted_authors: false, lookback_days: 7, requires_triage: bug}
  - {kind: new_reviews, min_new: 5, cooldown_hours: 24}
models: {}
output: {visibility: private}
budget: {monthly_usd: 50, max_scheduled_runs_per_day: 1}
engineering: {connection: null, language: null, feedback_type: bug}
learn: {cross_run: 'off'}
pr: ready
readiness: [connection, app_installation, ci_attestation, branch_rules, image, bedrock_models, agentcore_quota,
            network, session_storage, dial, budget, hard_cap, issues_source, issue_label, triage_enabled]
