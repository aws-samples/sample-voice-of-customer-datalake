# Python lint configuration (issue #201; rule set from the quality-gate brief).
#
# The gate is `ruff check lambda plugins scripts`, run from this directory by
# `lint:python` in the repo-root package.json and by scripts/validate.sh.
#
# The rule set is selected explicitly and ruff is pinned exactly in
# requirements-dev.txt, so the finding count no longer moves with ruff's own
# defaults (it went from 4 to 518 between 0.15.0 and 0.16.4 on the same tree).
#
# `scripts` is in the path because `scripts/mcp_gate.py` decides whether the MCP
# CI gate passes; `lambda/shared/test/test_mcp_gate_audit.py` unit-tests it.

target-version = "py312"
line-length = 120
# Import roots of the Lambda bundles and plugins, so isort (I001) groups
# `shared`, `_shared`, handler-local modules etc. as first-party.
src = ["lambda", "lambda/api", "plugins", "scripts"]
extend-exclude = [
    # Vendored third-party code: local layer build output from
    # scripts/build-layers.sh (bs4, six, ...). Never lint, never fix.
    "lambda/layers",
    "cdk.out",
    "node_modules",
    "frontend",
    "dist",
    ".venv",
    "build",
]

[lint]
select = [
    "F", "E", "W", "I", "B", "UP", "SIM", "RUF",   # correctness, imports (F401), modernisation, simplification
    "ARG",                                           # unused arguments (dead parameters)
    "RET", "PIE", "C4", "PERF", "PLW0108",           # returns, placeholders, comprehensions, loops, lambda wrappers
    "PLR1714", "PLR5501", "PLR1730",                 # `x == a or x == b`, `else: if`, hand-written min/max
    "FURB110", "FURB171", "FURB188",                 # `a if a else b`, `x in (y,)`, slice instead of removeprefix
    "ERA001",                                        # commented-out code
    "C901", "PLR0911", "PLR0912", "PLR0915",         # complexity, returns, branches, statements per function
    "S", "BLE001", "TRY002", "TRY300", "TRY301", "TRY400", "T20", "PT",
    # Measured at 0 (or fixed to 0) on 2026-10-08, so they only stop new findings:
    "LOG", "PLE", "RSE", "A", "PGH", "ISC", "T10", "TID", "ASYNC",   # logging, pylint errors, builtins shadowing, …
    "DTZ001", "PLW2901", "EXE", "ICN001", "PYI034", "FURB167",   # naive datetimes, loop-var reuse, …
    # Measured at 0 on 2026-10-09 (quality-gates wave), so they only stop new findings:
    "DTZ", "YTT", "INT", "PYI",                      # every naive datetime, sys.version misuse, gettext, stubs
    "PLR0124", "PLR0133",                            # comparing a name with itself, comparing two constants
    # Fixed to 0 in the same wave:
    "FURB136", "PLC0207", "PLR0402",                 # hand-written min/max ternary, split without maxsplit, `import a.b as b`
    "FIX", "TD",                                     # no TODO/FIXME/XXX/HACK left behind: fix it, or state the fact
    # Preview-only rules, selected by exact code (see `preview` below):
    "RUF029",                                        # `async def` that never awaits
    "PLR1702",                                       # more than 5 nested blocks
]
# `preview` is needed for RUF029 and PLR1702 only. `explicit-preview-rules` keeps every OTHER preview rule off
# (a prefix such as "RUF" or "PLR" never pulls one in); preview also turns on some stable rules' preview behaviour,
# which found 2 more (PERF102, RUF002) on 2026-10-09, both fixed. ruff is pinned exactly, so that set only moves
# on a deliberate upgrade (https://docs.astral.sh/ruff/preview/).
preview = true
explicit-preview-rules = true
# Measured and deliberately NOT selected (2026-10-08): G, TRY003/EM (log/exception message style), PLW0603 (the
# cold-start `global` caches are intended), INP001 (Lambda folders have no __init__.py), FBT (signature redesign),
# FLY002 (multi-line '\n'.join of pinned literals reads better than one long f-string), FURB162 (its fix changes
# behaviour: fromisoformat reads '2026-01-01+00:00' but rejects a date-only '2026-01-01Z'), PLR2004, PTH, N, TC,
# SLF, Q, ANN, D.
ignore = [
    "E501", "SIM108",
]
# Powertools' Logger: `logger.exception(...)` / `exc_info=True` count as handling for BLE001.
logger-objects = ["shared.logging.logger", "_shared.base_ingestor.logger"]
# Framework callbacks that must accept an argument and usually ignore it go here, by name, and nowhere else.
# `context`: the Lambda runtime's second handler argument.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|context)$"

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-branches = 15
max-statements = 60
max-returns = 8

[lint.per-file-ignores]
# Tests assert (S101) and hold fake secrets (S105/S106). Nothing else is exempt: an unused argument in a test is dead too.
"**/test_*.py" = ["S101", "S105", "S106"]
"**/*_test.py" = ["S101", "S105", "S106"]
"**/conftest.py" = ["S101", "S105"]
"scripts/**" = ["T201"]     # scripts talk to a terminal
# Reviewed security findings (wave 4), each scoped to the one file and code it concerns:
"lambda/shared/cloudfront_signing.py" = ["S303"]          # CloudFront signed URLs are RSA-SHA1 by AWS's spec
"lambda/shared/test/test_cloudfront_signing.py" = ["S303"]  # verifies that SHA1 signature
"lambda/shared/mcp_tokens.py" = ["S105"]                  # token-format prefixes, not secrets
"lambda/shared/mcp_global_tokens.py" = ["S105"]           # partition keys, not secrets
"lambda/api/mcp_tokens_handler.py" = ["S105"]             # a "Token not found" message, not a secret
"lambda/api/test/global_mcp_world.py" = ["S101"]          # test-support module: its helpers assert the MCP frames
"lambda/api/test/instrumentation.py" = ["S101"]           # test-support module: asserts a route keeps its tracer wrapper
"lambda/agents/test/document_node_cases.py" = ["S101"]   # shared test cases subclassed by the write_prd/write_prfaq suites
"lambda/api/scrapers_handler.py" = ["S310"]               # http(s) only after validate_url; every hop re-validated and its socket pinned to a vetted IP
"lambda/conftest.py" = ["S603"]           # fixed argv: sys.executable -c <constant code>
"lambda/shared/test/test_bedrock_retry_policy.py" = ["S603"]  # fresh interpreter, fixed argv
"lambda/processor/test/test_bundle_import.py" = ["S603"]  # fresh interpreter, fixed argv (#249 bundle import)
"lambda/shared/test/fresh_interpreter.py" = ["S603"]  # fresh interpreter, fixed argv (import-time guards)
"lambda/shared/test/test_root_conftest.py" = ["S603"]  # fresh pytest session, fixed argv (one literal plugin name)
"lambda/design_capture/conftest.py" = ["S603"]  # the DOM tests' jsdom runner: fixed argv (the located node binary, -e, a constant script)
"../scripts/audit/test_py_layers.py" = ["S603"]  # fixed argv: docker + the pinned Lambda image + a constant probe
"lambda/shared/test/test_snapstart.py" = ["S311"]  # tests the `random` reseed itself
"lambda/shared/test/test_model_agreement_handler.py" = ["S102"]  # execs the handler inlined in the CDK stack
"scripts/mcp_gate.py" = ["S314"]                          # parses the JUnit XML our own pytest run just wrote
# Per-review isolation and the job-level belt log the error TYPE only (privacy, see the handler), so
# they neither narrow the catch nor log the exception itself.
"lambda/jobs/category_reprocess/handler.py" = ["BLE001", "TRY400"]
